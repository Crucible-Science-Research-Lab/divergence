# prereg/003-opus-5-5-migration.yaml
# FROZEN v3, 30 October 2026. Committed with the analysis code before any confirmation trial was opened.
# Pre-registration for note three. Written before either confirmation job was downloaded.
# This file fixes the questions, arms, definitions, the one test every question is judged by,
# and what will not be claimed. It is frozen and committed publicly, with the analysis code,
# before any confirmation trial is opened. Any later change of plan is listed in the note under
# "deviations".
# v2 added what the exploration arm taught (28 and 29 Oct): settings checks, API errors, model
# switches, sub-agents, the step key and the split measures.
# v3 (29 Oct) replaces the per-question thresholds with one test, the same-model baseline;
# fixes "path changed" as steps or shared prefix (the first-split category is drawn, not scored);
# makes U3 and U6 reported measures; adds the cost clause and the task count for every check.
# The plain-words glossary for readers closes the file.
# Frozen 30 Oct after a fresh-eyes read: verdicts use the frozen step key; the glossary's
# 1 in 40 matches the test; path changed and U6 name their units; paths and status updated.

